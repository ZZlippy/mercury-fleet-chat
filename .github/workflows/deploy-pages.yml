name: Deploy demo to GitHub Pages

# This publishes ONLY the static "demo mode" build of apps/web — a UI-only
# build with no backend, seeded from committed sample fixtures
# (apps/web/src/demo/fixtures.json). See apps/web/src/demo/README.md.
# It does not deploy or affect the real application in any way.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static demo (no backend)
        env:
          DEMO_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build:demo

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
