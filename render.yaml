databases:
  - name: mercury-fleet-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: mercury-fleet-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install -g pnpm@9.15.9 && env -u NODE_ENV pnpm install --frozen-lockfile && pnpm build:web
    startCommand: pnpm migrate && pnpm seed && pnpm start:api
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mercury-fleet-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.11.0
